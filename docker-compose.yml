services:
  butler-core:
    build: .
    container_name: butler-core
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      # Lets the container reach a model server on the host at host.docker.internal
      - "host.docker.internal:host-gateway"
